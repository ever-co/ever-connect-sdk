name: CI

# Jobs:
#   public-safe         the gate's self-test, then every file, the branch name and the commit messages
#   generate-check      the generated files, the integration definitions and the fixtures equal what
#                       the tools produce from the contract; vendored files match VENDOR.json, and
#                       the statistics contract is held to the strict rules (published, byte for byte)
#   contract-sync       the contract and the vendored files equal the ever-co/platform checkout they
#                       were synchronised from (needs the read token; skipped with a notice without it)
#   ts                  frozen install, Biome, build, type check, the hand-written-client check and
#                       every TypeScript and tool test (the client, the verifier and its mutation
#                       corpus, redaction, the sample flow against the mock)
#   rust                formatting, Clippy (every feature set), the crate tests (the sample flow
#                       against the mock included), the lookup vectors without the client, no
#                       HTTP client without the client feature, no schema validator in the
#                       verifier-only build, and cargo deny
#   fixtures-roundtrip  TypeScript (ajv) and Rust (jsonschema + generated types) agree on every fixture
#   mock-rows           the mock answers every row and problem code; its image builds and starts
#   tools               the egress harness unit tests, the browser walk test inside the pinned
#                       Playwright image, and the self-test of both legs with their failing controls
#
# Every action is pinned by commit SHA (Renovate keeps the pins current).
#
# Runners: GitHub-hosted `ubuntu-latest` for every job; no job runs on a self-hosted runner, so
# the workflow is safe for a public repository. The token is read-only, no checkout keeps
# credentials, and GitHub gives no secrets to a pull request from a fork: the steps that need one
# skip and say so. Nothing here publishes anything.
on:
  push:
    branches: [develop, stage, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  CARGO_TERM_COLOR: always

jobs:
  public-safe:
    name: public-safe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Self-test (every rule is proven able to fail)
        run: node tools/check-public-safe.mjs --self-test
      - name: Files, branch name and commit messages (private phrase list from a secret; skipped without it)
        env:
          EVER_BANNED_PHRASES_JSON: ${{ secrets.EVER_BANNED_PHRASES_JSON }}
          EVER_PUSH_BEFORE: ${{ github.event.before }}
        run: node tools/check-public-safe.mjs

  generate-check:
    name: generate-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install rustup (when the runner image has no Rust)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL https://sh.rustup.rs \
              | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Generated files equal the contract (types, rows, docs regions, lock)
        run: node tools/generate.mjs --check
      - name: Integration definitions and constants
        run: node tools/split-integrations.mjs --check
      - name: Fixtures rebuild byte for byte
        run: node tools/fixtures/build-signed.mjs --check
      - name: Vendored files match VENDOR.json
        run: node tools/check-schema-drift.mjs
      - name: The statistics contract and the client-assertion vectors are published and vendored byte for byte (strict)
        run: |
          node tools/check-schema-drift.mjs --strict=stats
          node tools/check-schema-drift.mjs --strict=connect

  contract-sync:
    name: contract-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: token
        name: Read token available?
        env:
          TOKEN: ${{ secrets.PLATFORM_CONTRACT_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::PLATFORM_CONTRACT_READ_TOKEN is not set: the comparison with ever-co/platform is skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(node -p "require('./contracts/VENDOR.json').platform.commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
          repository: ever-co/platform
          ref: ${{ steps.token.outputs.commit }}
          token: ${{ secrets.PLATFORM_CONTRACT_READ_TOKEN }}
          path: .platform
          sparse-checkout: |
            contracts
            docs/specs/api
            docs/specs/contracts
            docs/specs/seeds
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: The contract equals the platform at the recorded commit
        if: steps.token.outputs.present == 'true'
        env:
          EVER_PLATFORM_REPO: .platform
        run: |
          pnpm install --frozen-lockfile
          node tools/sync-contract.mjs --check
          node tools/check-schema-drift.mjs
          node tools/check-schema-drift.mjs --strict=stats
          node tools/check-schema-drift.mjs --strict=connect

  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Biome (lint and format)
        run: pnpm exec biome ci .
      - name: Build
        run: pnpm run build
      - name: Type check
        run: pnpm -r --if-present run typecheck
      - name: Only the generated client makes requests (the known-bad fixture must fail)
        run: |
          node tools/check-handwritten-client.mjs --self-test
          node tools/check-handwritten-client.mjs
      - name: Workspace tests
        run: pnpm run test:workspaces
      - name: Tool tests (contract, schemas, constants, fixtures, managed operations)
        run: node --test "tools/test/sync-contract.test.mjs" "tools/test/schema-meta.test.mjs" "tools/test/constants.test.mjs" "tools/test/fixtures.test.mjs" "tools/test/managed-contracts.test.mjs"

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rustup (when the runner image has no Rust)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL https://sh.rustup.rs \
              | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (each feature set without the default client)
        run: |
          for features in "" entitlement lookup usage stats entitlement,lookup managed; do
            echo "features: [${features}]"
            cargo clippy -p ever-connect-sdk --no-default-features ${features:+--features "$features"} --locked -- -D warnings
          done
      - name: No HTTP client without the client feature; the verifier alone pulls no schema validator
        run: |
          count=$(cargo tree -p ever-connect-sdk --no-default-features --features entitlement,lookup -e normal --locked | grep -c reqwest || true)
          echo "reqwest crates in the tree: ${count}"
          test "${count}" = 0
          tree=$(cargo tree -p ever-connect-sdk --no-default-features --features entitlement -e normal --prefix none --locked)
          echo "${tree}" | sort -u
          for crate in reqwest jsonschema tokio; do
            if echo "${tree}" | grep -q "^${crate} "; then
              echo "::error::${crate} is in the tree of the entitlement feature"
              exit 1
            fi
          done
      - name: Start the mock platform (TEST root, https issuer, real clock)
        run: |
          pnpm install --frozen-lockfile
          EVER_MOCK_CONFIG_JSON='{"issuer":"https://mock-platform.test"}' \
            nohup node tools/mock-platform/bin/ever-mock-platform.mjs --port 8080 --host 127.0.0.1 > mock.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/__mock/healthz >/dev/null 2>&1; then echo "ready after ${i}s"; break; fi
            sleep 1
          done
      - name: Tests (all features; the sample flow runs against the mock)
        env:
          EVER_MOCK_PLATFORM_URL: http://127.0.0.1:8080
        run: cargo test --workspace --all-features --locked
      - name: Lookup vectors without the client (what the platform consumes)
        run: cargo test -p ever-connect-sdk --no-default-features --features lookup --test lookup_vectors --locked
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - name: Supply chain (licences, bans, sources, advisories)
        run: cargo deny check

  fixtures-roundtrip:
    name: fixtures-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install rustup (when the runner image has no Rust)
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL https://sh.rustup.rs \
              | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Rust verdicts (jsonschema and the generated types)
        run: cargo test --locked -p ever-connect-contracts --test fixtures_roundtrip
      - name: TypeScript verdicts and the comparison
        run: node tools/test/fixtures-roundtrip.mjs

  mock-rows:
    name: mock-rows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Build the contracts and SDK packages (the sample flow and the managed scenario import them)
        run: pnpm --filter @ever-co/connect-contracts --filter @ever-co/connect-sdk build
      - name: Every row and problem code, the sample flow, in-product consent and managed operations
        run: pnpm --filter ever-mock-platform test
      - name: The image builds and answers
        run: |
          docker build -t ever-mock-platform:ci tools/mock-platform
          cid=$(docker run -d ever-mock-platform:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if docker exec "$cid" wget -qO- http://127.0.0.1:8080/__mock/healthz >/dev/null 2>&1; then echo "ready after ${i}s"; break; fi
            sleep 1
          done
          docker exec "$cid" wget -qO- http://127.0.0.1:8080/.well-known/ever-keys.json | grep -q '"manifest"'

  tools:
    name: tools
    # The self-test needs Docker with NET_RAW and NET_ADMIN for the sniffers.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The browser leg's image (the harness pins the same digest; Renovate moves both with playwright-core).
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Harness unit tests (evidence recorded by real runs)
        run: node --test tools/egress-audit/test/
      - name: Docker and Compose
        run: |
          docker version --format 'docker {{.Server.Version}}'
          if ! docker compose version >/dev/null 2>&1; then
            mkdir -p "$HOME/.docker/cli-plugins"
            curl --proto '=https' --tlsv1.2 --retry 5 -fsSL -o "$HOME/.docker/cli-plugins/docker-compose" \
              "https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64"
            chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          fi
          docker compose version
      - name: The browser image (pinned by digest)
        run: |
          for i in 1 2 3; do docker pull -q "$PLAYWRIGHT_IMAGE" && break; echo "pull attempt $i failed"; sleep 10; done
          docker image inspect "$PLAYWRIGHT_IMAGE" --format 'browser image {{.Id}} {{.Size}}'
      - name: Browser walk test (inside the pinned Playwright image)
        run: docker run --rm -v "$PWD:/w" -w /w "$PLAYWRIGHT_IMAGE" node --test tools/egress-audit/test/browser.test.mjs
      - name: Self-test of both legs (off/leaky, off/ui-leaky and off/ui-link must fail, positive_stats without the mock must not pass, a failed sign-in must fault)
        env:
          # Names added to the never-allowed list for the run, kept out of the public files: from a
          # secret (empty without it), so logs mask them; reports name them extra#<n>.
          EVER_EGRESS_EXTRA_HOSTS: ${{ secrets.EVER_EGRESS_EXTRA_HOSTS }}
        run: node tools/egress-audit/run.mjs --selftest --legs api,browser --artifacts egress-audit-artifacts
      - name: Evidence (pcaps, DNS logs, HARs, DOM references, report.json)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egress-audit-selftest
          path: egress-audit-artifacts
          if-no-files-found: warn
          retention-days: 14
