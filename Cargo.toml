# The Rust half of the Ever Connect SDK.
#
#   crates/ever-connect-contracts   generated contract types and the contract files (constants,
#                                   integration definitions, schemas) as typed accessors
#   crates/xtask                    repository tasks: `cargo run -p xtask -- typify` writes the
#                                   generated types (called by tools/generate.mjs)

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-rc.3"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/ever-co/ever-connect-sdk"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# xtask only (code generation)
typify = "=0.8.0"
schemars = "=0.8.22"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"

# the managed-operation runner and the tests
jsonschema = { version = "0.58", default-features = false }

# the signers and verifiers
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
# patterns of the contract schemas (one uses a lookahead)
fancy-regex = { version = "0.19", default-features = false, features = ["std", "unicode"] }
sha2 = "0.10"
# lookup normalisation
idna = "1"
unicode-normalization = "0.1"
# the client (feature `client`): rustls with the webpki roots, no OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

# The signature checks run thousands of times in the tests: build the curve arithmetic optimised
# even in test builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
