# cargo-deny policy of this repository: licences, bans, sources and advisories of every crate the
# workspace builds (`cargo deny check` in the CI rust job). The crates of this repository carry
# the same licence as the rest of the repository and pass the same policy as their dependencies.

[graph]
all-features = true

[licenses]
# Permissive licences only: a copyleft licence anywhere in the graph fails the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

# The Mozilla CA list that reqwest's rustls roots carry is CA data under its own permissive
# licence.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# MIT without the attribution clause (more permissive than MIT), for one crate of the JSON
# Schema validator the managed-operation runner uses.
[[licenses.exceptions]]
crate = "borrow-or-share"
allow = ["MIT-0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# No OpenSSL: TLS is rustls.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
yanked = "deny"
